<!doctype html>
<html lang="sk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchball — potvrdenie e-mailu</title>
<link rel="icon" href="/favicon.ico?v=4" sizes="48x48">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=4">
<meta name="theme-color" content="#071A13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ten istý vzhľad ako matchballapp.com od 17. 9. 2026 — svetlá stránka,
   zelená z loga, písmo Outfit. Bez tmavého režimu: web má jednu identitu. */
:root{--ink:#071A13;--paper:#F5F8F5;--card:#FFFFFF;--green:#15803D;
  --green-soft:#E9F5ED;--fg:#0F1F17;--muted:#47594F;--line:#DFE8E2}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--fg);
  font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;min-height:100vh}
img{display:block;max-width:100%}
.znacka{display:flex;align-items:center;gap:10px;padding:26px 20px 0;
  font-weight:700;font-size:1.06rem;letter-spacing:-.02em;text-decoration:none;color:inherit}
.znacka img{width:30px;height:30px;flex:0 0 30px}
main{width:100%;max-width:30rem;margin:auto;padding:36px 20px 64px;text-align:center}
.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
  background:var(--green-soft);display:grid;place-items:center;font-size:2rem;line-height:1}
h1{font-size:clamp(1.5rem,5vw,1.9rem);font-weight:800;letter-spacing:-.028em;
  word-spacing:.05em;line-height:1.12;margin:0 0 .6rem}
p{margin:0 0 .9rem;color:var(--muted)}
</style>
<a class="znacka" href="/"><img src="/logo.webp" alt="" width="192" height="192"><span>Matchball</span></a>
<main>
  <div id="state">
    <p>Overujem…</p>
  </div>
</main>
<script type="module">
// Presná kópia logiky z src/navigation/RootNavigator.tsx (handleAuthDeepLink,
// vetva „auth/verified") — appka to isté robí sama, keď odkaz otvorí telefón
// s nainštalovanou appkou. Táto stránka je náhrada pre zariadenia bez appky
// (notebook, iný telefón), kde mecbal:// odkaz nemá čo otvoriť.
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://hpfcyriuitwbwtluaxbu.supabase.co',
  'sb_publishable_Ywd12xRPKBMQ8a6V7uyLhQ_nvmTabEU',
);

const TEXT = {
  sk: {
    doneTitle: 'Adresa je potvrdená', doneMsg: 'E-mail bol úspešne overený. Môžeš sa vrátiť do appky Matchball.',
    expiredTitle: 'Odkaz už neplatí', expiredMsg: 'Tento odkaz už neplatí. Vypýtaj si nový priamo v appke.',
  },
  cs: {
    doneTitle: 'Adresa je potvrzená', doneMsg: 'E-mail byl úspěšně ověřen. Můžeš se vrátit do appky Matchball.',
    expiredTitle: 'Odkaz už neplatí', expiredMsg: 'Tento odkaz už neplatí. Vyžádej si nový přímo v appce.',
  },
  en: {
    doneTitle: 'Email confirmed', doneMsg: 'Your email has been successfully verified. You can go back to the Matchball app.',
    expiredTitle: 'Link no longer valid', expiredMsg: 'This link is no longer valid. Ask for a new one in the app.',
  },
};
const lang = (navigator.language || 'sk').slice(0, 2);
const t = TEXT[lang] || TEXT.sk;

const el = document.getElementById('state');
function show(icon, title, msg) {
  el.innerHTML = `<div class="icon">${icon}</div><h1>${title}</h1><p>${msg}</p>`;
}

const params = new URLSearchParams(location.hash.slice(1));
const access_token = params.get('access_token');
const refresh_token = params.get('refresh_token') || '';
const linkError = params.get('error') || params.get('error_code');

async function run() {
  if (linkError || !access_token) {
    show('⚠️', t.expiredTitle, t.expiredMsg);
    return;
  }
  const { error: sessionError } = await supabase.auth.setSession({ access_token, refresh_token });
  if (sessionError) {
    show('⚠️', t.expiredTitle, t.expiredMsg);
    return;
  }
  // mark_email_verified (migrácia 267) si sám overí, že táto relácia vznikla
  // prihlásením cez odkaz z e-mailu (amr: magiclink) — táto stránka si teda
  // nič nemôže podvrhnúť, presne ako appka.
  const { error: rpcError } = await supabase.rpc('mark_email_verified');
  if (rpcError) {
    show('⚠️', t.expiredTitle, t.expiredMsg);
    return;
  }
  show('✓', t.doneTitle, t.doneMsg);
}
run();
</script>
</html>
